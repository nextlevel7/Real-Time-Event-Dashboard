[project]
name = "backend"
version = "0.1.0"
description = "Real-Time Event Dashboard Backend API"
readme = "README.md"
authors = [
    { name = "nextlevel7", email = "suzon9849@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.3",
    "pydantic-settings>=2.5.2",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

